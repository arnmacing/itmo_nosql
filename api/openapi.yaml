  /events/{event_id}/reviews/{review_id}:
    patch:
      tags: [ Reviews ]
      summary: Обновить отзыв
      operationId: patchReview
      description: Только автор отзыва может его изменить.
      security:
        - sessionCookie: [ ]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
          example: "6838a60123ad784ab518de0b"
        - name: review_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "f5a08ebf-f3cb-4f88-9739-18f2950bff16"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPatch'
            example:
              comment: "Обновлённый комментарий"
              rating: 4
      responses:
        '204':
          description: Отзыв обновлён
        '400':
          description: Невалидные поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Событие или отзыв не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Event not found"

  /recommendations:
    get:
      tags: [ Recommendations ]
      summary: Персональные рекомендации
      operationId: getRecommendations
      description: |
        Возвращает события, рекомендованные на основе коллаборативной фильтрации в Neo4j.
        Алгоритм: "пользователи, которым понравились те же события, также лайкнули"
        Результат кэшируется в Redis с TTL = `APP_RECOMMENDATIONS_TTL`.
      security:
        - sessionCookie: [ ]
      responses:
        '200':
          description: Список рекомендованных событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsListResponse'
              example:
