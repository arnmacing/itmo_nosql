              rating: 5
      responses:
        '201':
          description: Отзыв создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: "f5a08ebf-f3cb-4f88-9739-18f2950bff16"
        '400':
