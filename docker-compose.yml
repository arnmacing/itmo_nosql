services:
  gateway:
    build:
      context: .
    env_file:
      - .env.local
    depends_on:
      session-service:
        condition: service_started
      user-service:
        condition: service_started
      event-service:
        condition: service_started
    command: [ "healthcheck.GatewayApp" ]
    environment:
      SESSION_SERVICE_URL: "http://session-service:${SESSION_SERVICE_PORT}"
      USER_SERVICE_URL: "http://user-service:${USER_SERVICE_PORT}"
      EVENT_SERVICE_URL: "http://event-service:${EVENT_SERVICE_PORT}"
    ports:
      - "${APP_PORT}:${APP_PORT}"

  session-service:
    build:
      context: .
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_started
    command: [ "healthcheck.SessionServiceApp" ]
    expose:
      - "${SESSION_SERVICE_PORT}"

  user-service:
    build:
      context: .
    env_file:
      - .env.local
    depends_on:
      mongos:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: [ "healthcheck.UserServiceApp" ]
    expose:
      - "${USER_SERVICE_PORT}"

  event-service:
    build:
      context: .
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_started
      cassandra-test:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      mongos:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    command: [ "healthcheck.EventServiceApp" ]
    expose:
      - "${EVENT_SERVICE_PORT}"

  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--port", "${REDIS_PORT}" ]
    env_file:
      - .env.local
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  cassandra-test:
    image: cassandra:4.1
    env_file:
      - .env.local
    ports:
      - "${CASSANDRA_PORT}:${CASSANDRA_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh localhost ${CASSANDRA_PORT} -e \"DESCRIBE KEYSPACES\"" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1
    env_file:
      - .env.local
    depends_on:
      cassandra-test:
        condition: service_healthy
    volumes:
      - ./docker/cassandra-init.sh:/scripts/cassandra-init.sh:ro
    entrypoint: [ "/bin/bash", "/scripts/cassandra-init.sh" ]
    restart: "no"

  cfg1:
    image: mongo:7
    command: [ "mongod", "--configsvr", "--replSet", "cfgReplSet", "--bind_ip_all", "--port", "${MONGO_CFG_PORT}" ]
    volumes:
      - cfg1_data:/data/db

  shard1a:
    image: mongo:7
    command: [ "mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "${MONGO_SHARD1A_PORT}" ]
    volumes:
      - shard1a_data:/data/db

  shard1b:
    image: mongo:7
    command: [ "mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "${MONGO_SHARD1B_PORT}" ]
    volumes:
      - shard1b_data:/data/db

  shard1c:
    image: mongo:7
    command: [ "mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "${MONGO_SHARD1C_PORT}" ]
    volumes:
      - shard1c_data:/data/db

  shard2a:
    image: mongo:7
    command: [ "mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "${MONGO_SHARD2A_PORT}" ]
    volumes:
      - shard2a_data:/data/db

  shard2b:
    image: mongo:7
    command: [ "mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "${MONGO_SHARD2B_PORT}" ]
    volumes:
      - shard2b_data:/data/db

  shard2c:
    image: mongo:7
    command: [ "mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "${MONGO_SHARD2C_PORT}" ]
    volumes:
      - shard2c_data:/data/db

  mongos:
    image: mongo:7
    command: [ "mongos", "--configdb", "cfgReplSet/cfg1:${MONGO_CFG_PORT}", "--bind_ip_all", "--port", "${MONGODB_PORT}" ]
    depends_on:
      cfg1:
        condition: service_started
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    healthcheck:
      test: [ "CMD", "mongosh", "--host", "localhost", "--port", "${MONGODB_PORT}", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7
    env_file:
      - .env.local
    depends_on:
      cfg1:
        condition: service_started
      shard1a:
        condition: service_started
      shard1b:
        condition: service_started
      shard1c:
        condition: service_started
      shard2a:
        condition: service_started
      shard2b:
        condition: service_started
      shard2c:
        condition: service_started
      mongos:
        condition: service_started
    volumes:
      - ./docker/mongo-cluster-init.sh:/scripts/mongo-cluster-init.sh:ro
    entrypoint: [ "/bin/bash", "/scripts/mongo-cluster-init.sh" ]
    restart: "no"

volumes:
  cfg1_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data: